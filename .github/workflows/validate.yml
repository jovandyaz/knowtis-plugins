name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Test multi-agent sync
        run: node --test scripts/sync-agents.test.mjs

      - name: Validate and check generated output
        run: |
          node scripts/validate-plugins.mjs
          node scripts/sync-agents.mjs
          node scripts/sync-agents.mjs --check dist

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Validate marketplace
        run: pnpm dlx @anthropic-ai/claude-code@2.1.251 plugin validate .

      - name: Validate plugins (strict)
        run: |
          for p in plugins/*/; do
            echo "::group::$p"
            pnpm dlx @anthropic-ai/claude-code@2.1.251 plugin validate "$p" --strict
            echo "::endgroup::"
          done

      - name: Custom validation
        run: node scripts/validate-plugins.mjs

      - name: Test multi-agent sync
        run: node --test scripts/sync-agents.test.mjs

      - name: Multi-agent sync guard
        run: |
          node scripts/sync-agents.mjs
          node scripts/sync-agents.mjs --check dist

      - name: Validate portable Agent Skills
        run: |
          python -m pip install 'git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref'
          for skill in dist/.agents/skills/*/; do
            skills-ref validate "$skill"
          done

      - name: Version bump check
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          failed=0
          for dir in $(git diff --name-only "$base"...HEAD -- plugins/ | cut -d/ -f1-2 | sort -u); do
            name=$(basename "$dir")
            old=$(git show "$base:$dir/.claude-plugin/plugin.json" 2>/dev/null | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).version))' 2>/dev/null || echo "")
            if [ ! -f "$dir/.claude-plugin/plugin.json" ]; then
              echo "$name: plugin removed — OK"
              continue
            fi
            new=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$dir/.claude-plugin/plugin.json','utf8')).version)")
            if [ -z "$old" ]; then
              echo "$name: new plugin at $new — OK"
              continue
            fi
            if [ "$(printf '%s\n%s' "$old" "$new" | sort -V | tail -1)" = "$old" ]; then
              echo "::error::$name changed but version not bumped ($old -> $new)"
              failed=1
            fi
            if ! git diff --name-only "$base"...HEAD -- "$dir/CHANGELOG.md" | grep -q .; then
              echo "::error::$name changed but CHANGELOG.md was not updated"
              failed=1
            fi
          done
          exit $failed
